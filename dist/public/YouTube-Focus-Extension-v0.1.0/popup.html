<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Focus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <div class="eyebrow">YOUTUBE FOCUS</div>
          <h1>Protect your attention.</h1>
        </div>
        <label class="switch" aria-label="Enable focus mode">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </header>

      <a
        class="support-link"
        href="https://buymeacoffee.com/barayturk"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="support-icon" aria-hidden="true">☕</span>
        <span class="support-copy">
          <strong>Buy me a coffee</strong>
          <span>Support YouTube Focus</span>
        </span>
        <span class="support-arrow" aria-hidden="true">↗</span>
      </a>

      <section class="panel">
        <label for="topic">What are you focusing on?</label>
        <input id="topic" type="text" placeholder="e.g. Advanced quantum computing" />
        <p class="hint">Local matching is free and keeps your topic on this device.</p>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <label for="mode">Matching mode</label>
        </div>
        <select id="mode">
          <option value="topic">Focus topic</option>
          <option value="anchor">Current video anchor</option>
        </select>
        <button id="use-current" class="secondary" type="button">Use current video as anchor</button>
        <p id="anchor-status" class="hint">No anchor video saved.</p>
      </section>

      <button id="save" class="primary" type="button">Save focus</button>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
